<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Of Loop Dropdown</title>
</head>
<body>
    
    <select id="fruitDropdown">
        <option value="">Select a fruit</option>
    </select>

    <script>
        // Array of fruits
        let fruits = ["Apple", "Banana", "Mango", "Orange", "Grape"];

        // Variable to store HTML string
        let fruitContent = "";
        // For...of loop to build option elements
        for (let fruit of fruits) {
            fruitContent += "<option value='" + fruit + "'>" + fruit + "</option>";
        }
        // Set the select's innerHTML (append to existing default option)
        document.getElementById("fruitDropdown").innerHTML += fruitContent;
    </script>
</body>
</html>
