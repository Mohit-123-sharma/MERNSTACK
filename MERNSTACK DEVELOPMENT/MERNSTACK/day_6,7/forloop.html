<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Lists</title>
</head>
<body>
    <h3>Book Details:</h3>
    <ul id="bookList"></ul>

    <h3>Authors:</h3>
    <ul id="authorList"></ul>

    <script>
        // Object with book details
        let bookInfo = {
            title: "Science Quest",
            year: 2023,
            publisher: "EduBooks"
        };

        // For...in loop to populate book details list
        for (let key in bookInfo) {
            console.log("<li>" + key + ": " + bookInfo[key] + "</li>");
            document.getElementById("bookList").innerHTML += "<li>" + key + ": " + bookInfo[key] + "</li>";
        }

        // Array of authors
        let authors = ["Anita", "Vikram", "Priya"];

        // For...of loop to populate authors list
        for (let author of authors) {
            console.log(author);
            document.getElementById("authorList").innerHTML += "<li>" + author + "</li>";
        }
    </script>
</body>
</html>
