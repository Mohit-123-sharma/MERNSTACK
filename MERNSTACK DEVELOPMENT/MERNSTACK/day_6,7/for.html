<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple For Loop</title>
</head>
<body>
    
    <script>
        // For loop to print a message multiple times
        for (let i = 1; i <= 5; i++) {
            console.log("Hello, this is loop number: " + i);
        }
    </script>
</body>
</html>
