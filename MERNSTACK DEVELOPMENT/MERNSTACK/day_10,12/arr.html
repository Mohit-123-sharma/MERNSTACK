<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array in JS - Web Browsers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
            width: 300px;
            margin: 20px auto;
        }
        li {
            background-color: #f2f2f2;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
            text-align: left;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Web Browsers</h2>
    <ul id="browserList"></ul>

    <script>
        // Initialize array
        let browsers = [
            "Google Chrome",
            "Mozilla Firefox",
            "Microsoft Edge",
            "Safari",
            "Opera",
            "Brave",
            "Tor Browser",
            "Vivaldi"
        ];

        // Array operations
        browsers.push("UC Browser"); // Add to end
        browsers.pop(); // Remove last element
        browsers.pop(); // Remove last element
        browsers.shift(); // Remove first element
        browsers.unshift("Arc Browser"); // Add to beginning

        // Generate list
        let list = "";
        for (let key in browsers) {
            list += `<li>${key}: ${browsers[key]}</li>`;
        }

        // Populate unordered list
        document.getElementById('browserList').innerHTML = list;
    </script>
</body>
</html>
